<template>
    <div class={rootClass} role="img" aria-label={model.ariaLabel}>
        <span class="label">{model.label}</span>
        <div class="track" aria-hidden="true">
            <template lwc:if={model.arrowLeft}>
                <svg class="head" width="10" height="10" viewBox="0 0 10 10"><path d="M10 0L0 5L10 10z"></path></svg>
            </template>
            <span class="line"></span>
            <template lwc:if={model.arrowRight}>
                <svg class="head" width="10" height="10" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z"></path></svg>
            </template>
        </div>
        <template lwc:if={model.entities}>
            <span class="entities">{model.entities}</span>
        </template>
    </div>
</template>
