<template>
    <lightning-card title="Fulfilment" icon-name="standard:shipment">
        <div class="body">
            <template lwc:if={error}><p class="err">{error}</p></template>
            <template lwc:if={ready}>

                <template lwc:if={isDraft}>
                    <p class="intro">When this order is activated, Salesforce sends it to fulfilment automatically: it creates the TC Sales Order and assigns stock, the same way as for Shopify and Amazon orders. Choose where each line ships from (saved as you choose; Nfinity Main if you skip it). The table shows what today's stock would cover.</p>
                    <template lwc:if={hasLines}>
                        <lightning-combobox class="default" name="default" label="Default ship-from" value={ctx.defaultShipFrom} options={ctx.warehouses} onchange={handleDefault}></lightning-combobox>
                        <div class="tbl">
                            <table class="lines">
                                <thead><tr><th>Product</th><th>Ships from</th><th class="num">Requested</th><th class="num">Available</th><th class="num">Will assign</th><th class="num">Short</th><th>Status</th></tr></thead>
                                <tbody>
                                    <template for:each={lines} for:item="l">
                                        <tr key={l.itemId}>
                                            <td>{l.product}<template lwc:if={l.note}><div class="line-note">{l.note}</div></template></td>
                                            <td class="pick">
                                                <template lwc:if={l.pickable}>
                                                    <lightning-combobox data-id={l.itemId} label="Ships from" variant="label-hidden" value={l.shipFrom} options={ctx.warehouses} onchange={handleLine}></lightning-combobox>
                                                </template>
                                                <template lwc:else><span class="muted">{l.fixedNote}</span></template>
                                            </td>
                                            <td class="num">{l.qty}</td>
                                            <td class="num">{l.availableLabel}</td>
                                            <td class="num">{l.assignLabel}</td>
                                            <td class={l.shortCls}>{l.shortLabel}</td>
                                            <td><span class={l.pillCls}>{l.stockStatus}</span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <p class="note">If the chosen ship-from can't cover a line, it falls back to Nfinity Main when Main can. Otherwise it takes what's there and the rest is backordered; backorders are assigned automatically when stock arrives (PO receipt, inbound received, sellable return).</p>
                        <div class="actions">
                            <lightning-button variant="brand" label="Activate order" onclick={handleActivate} disabled={busy}></lightning-button>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="warn">Add products to the order. It goes to fulfilment automatically once it is activated.</p>
                    </template>
                </template>

                <template lwc:if={isSending}>
                    <div class="sending">
                        <template lwc:if={sendingTooLong}>
                            <p class="warn">Still waiting for the background job. Refresh the page in a minute, or send it now.</p>
                            <div class="actions"><lightning-button label="Send now" onclick={handleRetry} disabled={busy}></lightning-button></div>
                        </template>
                        <template lwc:else>
                            <lightning-spinner alternative-text="Sending" size="small" variant="brand"></lightning-spinner>
                            <p class="intro">Order activated. Sending it to fulfilment…</p>
                        </template>
                    </div>
                </template>

                <template lwc:if={isFailed}>
                    <p class="err">Fulfilment failed: {ctx.lastLogMessage}</p>
                    <div class="actions">
                        <lightning-button label="Open sync log" variant="base" onclick={openLog}></lightning-button>
                        <lightning-button label="Retry" variant="brand" onclick={handleRetry} disabled={busy}></lightning-button>
                    </div>
                </template>

                <template lwc:if={isSent}>
                    <p class="sent"><lightning-icon icon-name="utility:success" size="x-small" variant="success"></lightning-icon><a onclick={openSalesOrder}>{statusLine}</a></p>
                    <template lwc:if={summary}>
                        <p class="summary"><span class={summaryCls}>{ctx.stockStatus}</span>{summary}</p>
                    </template>
                    <div class="tbl">
                        <table class="lines">
                            <thead><tr><th>Product</th><th>Ships from</th><th class="num">Requested</th><th class="num">Assigned</th><th class="num">Short</th><th class="num">Shipped</th><th>Status</th></tr></thead>
                            <tbody>
                                <template for:each={soLines} for:item="l">
                                    <tr key={l.id}>
                                        <td>{l.product}</td>
                                        <td>{l.shipFrom}</td>
                                        <td class="num">{l.requestedLabel}</td>
                                        <td class="num">{l.assignedLabel}</td>
                                        <td class={l.shortCls}>{l.shortLabel}</td>
                                        <td class="num">{l.shippedLabel}</td>
                                        <td><span class={l.pillCls}>{l.stockStatus}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <template lwc:if={hasPending}>
                        <p class="intro">Demo only: in production, ShipStation, the decorator, the factory or the 3PL reports these. Each ships what is assigned.</p>
                        <div class="ship">
                            <template for:each={pending} for:item="p">
                                <lightning-button key={p.code} label={p.label} data-code={p.code} onclick={handleShip} disabled={busy}></lightning-button>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <p class="intro">Nothing left to ship on this order.</p>
                    </template>
                </template>

                <template lwc:if={lastMessage}><p class="last">{lastMessage}</p></template>
            </template>
        </div>
    </lightning-card>
</template>
